    <style>

<body>
    <div id="root"></div>

    <script type="text/babel">

        // ==================== FIREBASE CONFIGURATION ====================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let firebaseApp, firebaseAuth, firebaseDb;
        let firebaseInitialized = false;

        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            firebaseAuth = firebase.auth();
            firebaseDb = firebase.firestore();
            firebaseInitialized = true;
            console.log('Firebase initialized');
        } catch (e) {
            console.error('Firebase init failed:', e);
        }

        // ==================== AUDIO SYSTEM ====================
        class AudioManager {
            constructor() {
                this.audioContext = null;
                this.masterVolume = 0.5;
                this.musicEnabled = true;
                this.sfxEnabled = true;
                this.isMuted = false;
                this.currentMusic = null;
                this.musicPlaying = false;
            }

            init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            setVolume(value) { this.masterVolume = value / 100; }
            toggleMute() { this.isMuted = !this.isMuted; return this.isMuted; }
            toggleMusic() { 
                this.musicEnabled = !this.musicEnabled; 
                if (!this.musicEnabled && this.currentMusic) this.stopMusic();
                else if (this.musicEnabled && !this.isMuted) this.playBackgroundMusic();
                return this.musicEnabled; 
            }
            toggleSFX() { this.sfxEnabled = !this.sfxEnabled; return this.sfxEnabled; }

            playSound(type) {
                if (!this.audioContext || this.isMuted || !this.sfxEnabled) return;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);

                switch (type) {
                    case 'correct':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(1046.5, this.audioContext.currentTime + 0.1);
                        gain.gain.setValueAtTime(0.3 * this.masterVolume, this.audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        osc.start(); osc.stop(this.audioContext.currentTime + 0.3);
                        break;
                    case 'wrong':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, this.audioContext.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(100, this.audioContext.currentTime + 0.2);
                        gain.gain.setValueAtTime(0.3 * this.masterVolume, this.audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        osc.start(); osc.stop(this.audioContext.currentTime + 0.3);
                        break;
                    case 'click':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(800, this.audioContext.currentTime);
                        gain.gain.setValueAtTime(0.1 * this.masterVolume, this.audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.05);
                        osc.start(); osc.stop(this.audioContext.currentTime + 0.05);
                        break;
                    case 'matchFound':
                        this.playArpeggio([523.25, 659.25, 783.99, 1046.5]);
                        break;
                    case 'gameover':
                        this.playDescendingTone();
                        break;
                }
            }

            playArpeggio(freqs) {
                if (!this.audioContext || this.isMuted || !this.sfxEnabled) return;
                freqs.forEach((f, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.2 * this.masterVolume, this.audioContext.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + i * 0.1 + 0.3);
                    osc.start(this.audioContext.currentTime + i * 0.1);
                    osc.stop(this.audioContext.currentTime + i * 0.1 + 0.3);
                });
            }

            playDescendingTone() {
                if (!this.audioContext || this.isMuted || !this.sfxEnabled) return;
                const freqs = [523.25, 493.88, 466.16, 440, 415.30, 392, 369.99, 349.23, 329.63];
                freqs.forEach((f, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.2 * this.masterVolume, this.audioContext.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + i * 0.1 + 0.15);
                    osc.start(this.audioContext.currentTime + i * 0.1);
                    osc.stop(this.audioContext.currentTime + i * 0.1 + 0.15);
                });
            }

            playBackgroundMusic() {
                if (!this.audioContext || this.isMuted || !this.musicEnabled || this.musicPlaying) return;
                this.musicPlaying = true;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.type = 'sine';
                osc.frequency.value = 110;
                gain.gain.setValueAtTime(0.05 * this.masterVolume, this.audioContext.currentTime);
                osc.start();
                this.currentMusic = { stop: () => { osc.stop(); this.musicPlaying = false; }};
            }

            stopMusic() {
                if (this.currentMusic) {
                    this.currentMusic.stop();
                    this.currentMusic = null;
                }
            }
        }

        const audioManager = new AudioManager();

        // ==================== CONTEXTS ====================
        const NotificationContext = React.createContext();
        const ThemeContext = React.createContext();
        const UserContext = React.createContext();

        const NotificationProvider = ({ children }) => {
            const [notifications, setNotifications] = React.useState([]);
            const showNotification = (message, type = 'info') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => setNotifications(prev => prev.filter(n => n.id !== id)), 3000);
            };
            return (
                <NotificationContext.Provider value={{ showNotification }}>

        // ==================== MATCHMAKING SCREEN ====================
        const MatchmakingScreen = ({ onCancel, onMatchFound }) => {
            const { user, userData } = React.useContext(UserContext);
            const { showNotification } = React.useContext(NotificationContext);
            const [status, setStatus] = React.useState('searching');
            const lobbyListener = React.useRef(null);

            React.useEffect(() => {
                if (!firebaseDb || !user) return;
                audioManager.init();
                startMatchmaking();
                return () => { if (lobbyListener.current) lobbyListener.current(); };
            }, []);

            const generateQuestions = () => {
                const questions = [];
                for (let i = 0; i < 10; i++) {
                    const num1 = Math.floor(Math.random() * 20) + 1;
                    const num2 = Math.floor(Math.random() * 20) + 1;
                    const ops = ['+', '-', '*'];
                    const op = ops[Math.floor(Math.random() * 3)];
                    let ans = op === '+' ? num1 + num2 : op === '-' ? num1 - num2 : num1 * num2;
                    const wrong = [];
                    while (wrong.length < 3) {
                        const w = ans + Math.floor(Math.random() * 20) - 10;
                        if (w !== ans && w > 0 && !wrong.includes(w)) wrong.push(w);
                    }
                    questions.push({ text: `${num1} ${op} ${num2} = ?`, answer: ans, options: [ans, ...wrong].sort(() => Math.random() - 0.5) });
                }
                return questions;
            };

            const startMatchmaking = async () => {
                try {
                    const result = await firebaseDb.runTransaction(async (transaction) => {
                        const lobbiesRef = firebaseDb.collection('pvp_lobbies');
                        const waitingQuery = await lobbiesRef.where('status', '==', 'waiting').where('hostId', '!=', user.uid).limit(1).get();
                        
                        if (!waitingQuery.empty) {
                            const lobbyDoc = waitingQuery.docs[0];
                            const lobbyRef = lobbiesRef.doc(lobbyDoc.id);
                            transaction.update(lobbyRef, {
                                guestId: user.uid, guestName: userData?.username || 'Player',
                                status: 'starting', startedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            return { action: 'joined', lobbyId: lobbyDoc.id };
                        } else {
                            const newLobbyRef = lobbiesRef.doc();
                            transaction.set(newLobbyRef, {
                                hostId: user.uid, hostName: userData?.username || 'Player',
                                guestId: null, guestName: null, status: 'waiting',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                hostScore: 0, guestScore: 0, hostCorrect: 0, guestCorrect: 0,
                                currentQuestion: 0, questions: generateQuestions()
                            });
                            return { action: 'created', lobbyId: newLobbyRef.id };
                        }
                    });

                    if (result.action === 'joined') {
                        audioManager.playSound('matchFound');
                        onMatchFound(result.lobbyId, 'guest');
                    } else {
                        setStatus('waiting');
                        lobbyListener.current = firebaseDb.collection('pvp_lobbies').doc(result.lobbyId)
                            .onSnapshot((doc) => {
                                if (doc.exists && doc.data().status === 'starting' && doc.data().guestId) {
                                    audioManager.playSound('matchFound');
                                    onMatchFound(result.lobbyId, 'host');
                                }
                            });
                    }
                } catch (error) {
                    console.error('Matchmaking error:', error);
                    showNotification('Matchmaking failed: ' + error.message, 'error');
                    onCancel();
                }
            };

            return (
                <div className="page">
                    <div className="matchmaking-container">
                        <div className="spinner"></div>
                        <div className="matchmaking-text">{status==='searching'?'FINDING MATCH...':'WAITING FOR OPPONENT...'}</div>
                        <div className="matchmaking-subtext">{status==='searching'?'Searching for available players':'Your lobby is ready. Waiting for someone to join...'}</div>
                        <button className="btn btn-danger" onClick={onCancel}><i className="fas fa-times"></i> CANCEL</button>
                    </div>
                </div>
            );
        };

        // ==================== PVP ARENA ====================
        const PVPArena = ({ lobbyId, playerRole, onExit }) => {
            const { user, userData, updateUserData, addMatchToHistory } = React.useContext(UserContext);
            const [lobbyData, setLobbyData] = React.useState(null);
            const [currentQuestion, setCurrentQuestion] = React.useState(0);
            const [myCorrect, setMyCorrect] = React.useState(0);
            const [myWrong, setMyWrong] = React.useState(0);
            const [timeLeft, setTimeLeft] = React.useState(15);
            const [answered, setAnswered] = React.useState(false);
            const [gameOver, setGameOver] = React.useState(false);
            const [winner, setWinner] = React.useState(null);
            const timerRef = React.useRef(null);
            const lobbyListener = React.useRef(null);
            const isHost = playerRole === 'host';

            React.useEffect(() => {
                if (!firebaseDb || !lobbyId) return;
                audioManager.init();
                lobbyListener.current = firebaseDb.collection('pvp_lobbies').doc(lobbyId)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setLobbyData(data);
                            if (data.status === 'finished') {
                                setGameOver(true);
                                const myScore = isHost ? data.hostScore : data.guestScore;
                                const oppScore = isHost ? data.guestScore : data.hostScore;
                                setWinner(myScore > oppScore ? 'you' : myScore < oppScore ? 'opponent' : 'tie');
                            }
                        }
                    });
                return () => {
                    if (lobbyListener.current) lobbyListener.current();
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [lobbyId]);

            React.useEffect(() => {
                if (!answered && !gameOver && lobbyData) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => { if (prev <= 1) { handleTimeout(); return 15; } return prev - 1; });
                    }, 1000);
                }
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [answered, gameOver, currentQuestion, lobbyData]);

            const handleAnswer = async (option) => {
                if (answered || !lobbyData) return;
                setAnswered(true);
                const question = lobbyData.questions[currentQuestion];
                const isCorrect = option === question.answer;

                if (isCorrect) {
                    audioManager.playSound('correct');
                    const points = Math.ceil(timeLeft * 10);
                    setMyCorrect(prev => prev + 1);
                    await firebaseDb.collection('pvp_lobbies').doc(lobbyId).update({
                        [isHost ? 'hostScore' : 'guestScore']: firebase.firestore.FieldValue.increment(points),
                        [isHost ? 'hostCorrect' : 'guestCorrect']: firebase.firestore.FieldValue.increment(1)
                    });
                } else {
                    audioManager.playSound('wrong');
                    setMyWrong(prev => prev + 1);
                }

                setTimeout(() => {
                    if (currentQuestion < lobbyData.questions.length - 1) {
                        setCurrentQuestion(prev => prev + 1);
                        setTimeLeft(15);
                        setAnswered(false);
                        firebaseDb.collection('pvp_lobbies').doc(lobbyId).update({ currentQuestion: currentQuestion + 1 });
                    } else { endGame(); }
                }, 1500);
            };

            const handleTimeout = () => {
                setAnswered(true);
                setMyWrong(prev => prev + 1);
                audioManager.playSound('wrong');
                setTimeout(() => {
                    if (currentQuestion < (lobbyData?.questions?.length || 10) - 1) {
                        setCurrentQuestion(prev => prev + 1);
                        setTimeLeft(15);
                        setAnswered(false);
                    } else { endGame(); }
                }, 1500);
            };

            const endGame = async () => {
                if (!lobbyData) return;
                const myScore = isHost ? lobbyData.hostScore : lobbyData.guestScore;
                const oppScore = isHost ? lobbyData.guestScore : lobbyData.hostScore;
                const totalQ = myCorrect + myWrong;
                const accuracy = totalQ > 0 ? Math.round((myCorrect / totalQ) * 100) : 0;

                await firebaseDb.collection('pvp_lobbies').doc(lobbyId).update({
                    status: 'finished', finishedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await addMatchToHistory({
                    mode: 'PVP', result: myScore > oppScore ? 'win' : myScore < oppScore ? 'loss' : 'tie',
                    score: myScore, opponentScore: oppScore, accuracy, correct: myCorrect, wrong: myWrong
                });

                const newStats = {
                    totalGames: (userData?.stats?.totalGames || 0) + 1,
                    totalCorrect: (userData?.stats?.totalCorrect || 0) + myCorrect,
                    totalWrong: (userData?.stats?.totalWrong || 0) + myWrong,
                    totalScore: (userData?.stats?.totalScore || 0) + myScore,
                    pvpWins: (userData?.stats?.pvpWins || 0) + (myScore > oppScore ? 1 : 0),
                    pvpLosses: (userData?.stats?.pvpLosses || 0) + (myScore < oppScore ? 1 : 0)
                };
                newStats.accuracy = Math.round((newStats.totalCorrect / (newStats.totalCorrect + newStats.totalWrong)) * 100) || 0;
                await updateUserData({ stats: newStats });

                setGameOver(true);
                setWinner(myScore > oppScore ? 'you' : myScore < oppScore ? 'opponent' : 'tie');
                audioManager.playSound('gameover');
            };

            const getMyScore = () => isHost ? (lobbyData?.hostScore || 0) : (lobbyData?.guestScore || 0);
            const getOppScore = () => isHost ? (lobbyData?.guestScore || 0) : (lobbyData?.hostScore || 0);
            const getOppName = () => isHost ? (lobbyData?.guestName || 'Waiting...') : (lobbyData?.hostName || 'Opponent');

            if (gameOver) {
                return (
                    <div className="page">
                        <div className="matchmaking-container">
                            <h1 className="arcade-title" style={{color:winner==='you'?'var(--success)':winner==='opponent'?'var(--error)':'var(--accent-gold)'}}>
                                {winner==='you'?'VICTORY!':winner==='opponent'?'DEFEAT':'DRAW!'}
                            </h1>
                            <div className="card" style={{minWidth:'300px',marginBottom:'20px'}}>
                                <div className="grid grid-2">
                                    <div className="text-center"><div className="stat-label">Your Score</div><div className="stat-value">{getMyScore()}</div></div>
                                    <div className="text-center"><div className="stat-label">Opponent</div><div className="stat-value">{getOppScore()}</div></div>
                                </div>
                                <div className="text-center mt-2"><div className="stat-label">Your Accuracy</div><div className="stat-value">{Math.round((myCorrect/(myCorrect+myWrong))*100)||0}%</div></div>
                            </div>
                            <button className="btn btn-primary" onClick={onExit}><i className="fas fa-home"></i> BACK TO DASHBOARD</button>
                        </div>
                    </div>
                );
            }

            const question = lobbyData?.questions?.[currentQuestion];

            return (
                <div className="page">
                    <header className="main-header">
                        <div className="logo">NumerIQ - PVP</div>
                        <div className="header-actions">
                            <button className="btn btn-small btn-danger" onClick={onExit}><i className="fas fa-times"></i> FORFEIT</button>
                        </div>
                    </header>
                    <div className="container">
                        <div className="pvp-arena">
                            <div className={`pvp-player ${getMyScore()>getOppScore()?'active':''}`}>
                                <div className="avatar avatar-large" style={{margin:'0 auto',background:'var(--accent-cyan)'}}>{userData?.avatar?.value||'?'}</div>
                                <div className="player-name">{userData?.username||'You'}</div>
                                <div className="player-score">{getMyScore()}</div>
                                <div style={{color:'var(--text-secondary)',fontSize:'0.8rem'}}>Correct: {myCorrect} | Wrong: {myWrong}</div>
                            </div>
                            <div className="vs-divider">VS</div>
                            <div className={`pvp-player ${getOppScore()>getMyScore()?'active':''}`}>
                                <div className="avatar avatar-large" style={{margin:'0 auto',background:'var(--accent-magenta)'}}>?</div>
                                <div className="player-name">{getOppName()}</div>
                                <div className="player-score">{getOppScore()}</div>
                                <div style={{color:'var(--text-secondary)',fontSize:'0.8rem'}}>Question {lobbyData?.currentQuestion+1||currentQuestion+1}/10</div>
                            </div>
                        </div>
                        {question && (
                            <div className="game-container">
                                <div className="question-container">
                                    <div className="question-text">{question.text}</div>
                                    <div className="timer-bar"><div className={`timer-fill ${timeLeft<5?'warning':''}`} style={{width:`${(timeLeft/15)*100}%`}}></div></div>
                                </div>
                                <div className="answers-grid">
                                    {question.options.map((opt,idx)=>(
                                        <button key={idx} className={`answer-btn ${answered?(opt===question.answer?'correct':''):''}`} onClick={()=>handleAnswer(opt)} disabled={answered}>{opt}</button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==================== SOLO GAME ====================
        const SoloGame = ({ onExit }) => {
            const { userData, updateUserData, addMatchToHistory } = React.useContext(UserContext);
            const [currentQuestion, setCurrentQuestion] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [correct, setCorrect] = React.useState(0);
            const [wrong, setWrong] = React.useState(0);
            const [timeLeft, setTimeLeft] = React.useState(15);
            const [answered, setAnswered] = React.useState(false);
            const [gameOver, setGameOver] = React.useState(false);
            const [questions, setQuestions] = React.useState([]);
            const timerRef = React.useRef(null);

            const generateQuestions = () => {
                const qs = [];
                for (let i = 0; i < 10; i++) {
                    const num1 = Math.floor(Math.random() * 20) + 1;
                    const num2 = Math.floor(Math.random() * 20) + 1;
                    const ops = ['+', '-', '*'];
                    const op = ops[Math.floor(Math.random() * 3)];
                    let ans = op === '+' ? num1 + num2 : op === '-' ? num1 - num2 : num1 * num2;
                    const wrong = [];
                    while (wrong.length < 3) {
                        const w = ans + Math.floor(Math.random() * 20) - 10;
                        if (w !== ans && w > 0 && !wrong.includes(w)) wrong.push(w);
                    }
                    qs.push({ text: `${num1} ${op} ${num2} = ?`, answer: ans, options: [ans, ...wrong].sort(() => Math.random() - 0.5) });
                }
                return qs;
            };

            React.useEffect(() => { audioManager.init(); setQuestions(generateQuestions()); }, []);

            React.useEffect(() => {
                if (!answered && !gameOver && questions.length > 0) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => { if (prev <= 1) { handleTimeout(); return 15; } return prev - 1; });
                    }, 1000);
                }
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [answered, gameOver, currentQuestion, questions]);

            const handleAnswer = (option) => {
                if (answered || questions.length === 0) return;
                setAnswered(true);
                const q = questions[currentQuestion];
                if (option === q.answer) {
                    audioManager.playSound('correct');
                    setScore(prev => prev + Math.ceil(timeLeft * 10));
                    setCorrect(prev => prev + 1);
                } else {
                    audioManager.playSound('wrong');
                    setWrong(prev => prev + 1);
                }
                setTimeout(() => {
                    if (currentQuestion < questions.length - 1) {
                        setCurrentQuestion(prev => prev + 1);
                        setTimeLeft(15);
                        setAnswered(false);
                    } else { endGame(); }
                }, 1500);
            };

            const handleTimeout = () => {
                setAnswered(true);
                setWrong(prev => prev + 1);
                audioManager.playSound('wrong');
                setTimeout(() => {
                    if (currentQuestion < questions.length - 1) {
                        setCurrentQuestion(prev => prev + 1);
                        setTimeLeft(15);
                        setAnswered(false);
                    } else { endGame(); }
                }, 1500);
            };

            const endGame = async () => {
                const totalQ = correct + wrong;
                const accuracy = totalQ > 0 ? Math.round((correct / totalQ) * 100) : 0;
                await addMatchToHistory({ mode: 'Solo', result: 'practice', score, accuracy, correct, wrong });
                const newStats = {
                    totalGames: (userData?.stats?.totalGames || 0) + 1,
                    totalCorrect: (userData?.stats?.totalCorrect || 0) + correct,
                    totalWrong: (userData?.stats?.totalWrong || 0) + wrong,
                    totalScore: (userData?.stats?.totalScore || 0) + score
                };
                newStats.accuracy = Math.round((newStats.totalCorrect / (newStats.totalCorrect + newStats.totalWrong)) * 100) || 0;
                await updateUserData({ stats: newStats });
                setGameOver(true);
                audioManager.playSound('gameover');
            };

            if (gameOver) {
                const accuracy = Math.round((correct / (correct + wrong)) * 100) || 0;
                return (
                    <div className="page">
                        <div className="matchmaking-container">
                            <h1 className="arcade-title" style={{color:'var(--accent-gold)'}}>GAME OVER</h1>
                            <div className="card" style={{minWidth:'300px',marginBottom:'20px'}}>
                                <div className="grid grid-2">
                                    <div className="text-center"><div className="stat-label">Score</div><div className="stat-value">{score}</div></div>
                                    <div className="text-center"><div className="stat-label">Accuracy</div><div className="stat-value">{accuracy}%</div></div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button className="btn btn-primary" onClick={()=>{setCurrentQuestion(0);setScore(0);setCorrect(0);setWrong(0);setTimeLeft(15);setAnswered(false);setGameOver(false);setQuestions(generateQuestions());}}><i className="fas fa-redo"></i> PLAY AGAIN</button>
                                <button className="btn btn-secondary" onClick={onExit}><i className="fas fa-home"></i> DASHBOARD</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQuestion];

            return (
                <div className="page">
                    <header className="main-header">
                        <div className="logo">NumerIQ - Practice</div>
                        <div className="header-actions"><button className="btn btn-small btn-danger" onClick={onExit}><i className="fas fa-times"></i> QUIT</button></div>
                    </header>
                    <div className="game-container">
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
                            <div className="stat-box" style={{minWidth:'100px'}}><div className="stat-label">Score</div><div className="stat-value">{score}</div></div>
                            <div className="stat-box" style={{minWidth:'100px'}}><div className="stat-label">Time</div><div className="stat-value">{timeLeft}</div></div>
                            <div className="stat-box" style={{minWidth:'100px'}}><div className="stat-label">Question</div><div className="stat-value">{currentQuestion+1}/10</div></div>
                        </div>
                        {q && (
                            <>
                                <div className="question-container">
                                    <div className="question-text">{q.text}</div>
                                    <div className="timer-bar"><div className={`timer-fill ${timeLeft<5?'warning':''}`} style={{width:`${(timeLeft/15)*100}%`}}></div></div>
                                </div>
                                <div className="answers-grid">
                                    {q.options.map((opt,idx)=>(<button key={idx} className={`answer-btn ${answered?(opt===q.answer?'correct':''):''}`} onClick={()=>handleAnswer(opt)} disabled={answered}>{opt}</button>))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ==================== MAIN APP ====================
        const App = () => {
            const [currentScreen, setCurrentScreen] = React.useState('landing');
            const [pvpLobbyId, setPvpLobbyId] = React.useState(null);
            const [pvpRole, setPvpRole] = React.useState(null);
            const { user, loading } = React.useContext(UserContext);

            React.useEffect(() => {
                const handleInteraction = () => { audioManager.init(); document.removeEventListener('click', handleInteraction); };
                document.addEventListener('click', handleInteraction);
                return () => document.removeEventListener('click', handleInteraction);
            }, []);

            React.useEffect(() => { if (user && currentScreen === 'login') setCurrentScreen('dashboard'); }, [user]);

            const handlePlayNow = () => { audioManager.playSound('click'); setCurrentScreen(user?'dashboard':'login'); };
            const handleTryDemo = () => { audioManager.playSound('click'); setCurrentScreen('solo'); };
            const handleLoginSuccess = () => setCurrentScreen('dashboard');
            const handleLogout = async () => { audioManager.playSound('click'); if (firebaseAuth) await firebaseAuth.signOut(); setCurrentScreen('landing'); };
            const handleStartPVP = () => { audioManager.playSound('click'); setCurrentScreen('matchmaking'); };
            const handleStartSolo = () => { audioManager.playSound('click'); setCurrentScreen('solo'); };
            const handleMatchFound = (lobbyId, role) => { setPvpLobbyId(lobbyId); setPvpRole(role); setCurrentScreen('pvp'); };
            const handleCancelMatchmaking = () => setCurrentScreen('dashboard');
            const handleExitPVP = () => { setPvpLobbyId(null); setPvpRole(null); setCurrentScreen('dashboard'); };
            const handleExitSolo = () => setCurrentScreen(user?'dashboard':'landing');

            if (loading) return <div className="loading-overlay"><div className="spinner"></div><p>Loading...</p></div>;

            return (
                <>
                    {currentScreen==='landing'&&<LandingPage onPlayNow={handlePlayNow} onTryDemo={handleTryDemo}/>}
                    {currentScreen==='login'&&<LoginPage onBack={()=>setCurrentScreen('landing')} onLoginSuccess={handleLoginSuccess}/>}
                    {currentScreen==='dashboard'&&user&&<Dashboard onLogout={handleLogout} onStartPVP={handleStartPVP} onStartSolo={handleStartSolo}/>}
                    {currentScreen==='matchmaking'&&<MatchmakingScreen onCancel={handleCancelMatchmaking} onMatchFound={handleMatchFound}/>}
                    {currentScreen==='pvp'&&pvpLobbyId&&<PVPArena lobbyId={pvpLobbyId} playerRole={pvpRole} onExit={handleExitPVP}/>}
                    {currentScreen==='solo'&&<SoloGame onExit={handleExitSolo}/>}
                </>
            );
        };

        // ==================== ROOT RENDER ====================
        const Root = () => (
            <NotificationProvider>
                <ThemeProvider>
                    <UserProvider>
                        <App />
                    </UserProvider>
                </ThemeProvider>
            </NotificationProvider>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
